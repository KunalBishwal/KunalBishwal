name: Refresh profile visuals

on:
  schedule:
    # Refresh stats and project cards every six hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile_assets.py"
      - "scripts/cards.py"
      - "scripts/radar.py"
      - "assets/skills.json"
      - "assets/stack.json"
      - "assets/projects.json"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate custom terminal banners
        run: python scripts/profile_assets.py --banner-only

      - name: Generate skill and stack radar charts
        run: |
          python scripts/radar.py --data assets/skills.json -o assets/radar
          python scripts/radar.py --data assets/stack.json -o assets/radar-stack --values

      - name: Generate live language radar and self-hosted stats/project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar.py --github "${{ github.repository_owner }}" -o assets/radar-langs --values
          python scripts/cards.py --user "${{ github.repository_owner }}" --projects assets/projects.json --out assets

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile visuals"
          git push
